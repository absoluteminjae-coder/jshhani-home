<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상품 | 제세현한의원</title>
<meta name="description" content="제세현한의원 상품 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shop-v3140.css">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
</head>
<body data-jsh-build="3.15.32">

<header class="header">
  <div class="container header-top">
    <a class="brand" href="/" aria-label="제세현한의원 홈">
      <img class="static-brand-logo" src="assets/logo-jesehyun-v3130.png" alt="제세현한의원">
    </a>
    <div class="header-actions">
      <a class="header-btn" href="tel:0432211275">043-221-1275</a>
      <a class="header-btn primary" href="#">네이버 예약</a>
    </div>
  </div>
  <nav class="container desktop-nav" data-dynamic-nav></nav>
</header>

<main>
  <section class="shop-hero">
    <div class="container">
      <div class="shop-kicker">JESEHYUN STORE</div>
      <h1>제세현한의원 상품</h1>
      <p>한의원에서 안내하는 상품을 확인할 수 있습니다. 구매는 각 상품에 연결된 외부 판매처에서 진행됩니다.</p>
    </div>
  </section>

  <div class="container">
    <div class="shop-toolbar">
      <div class="shop-cats" id="shopCategories"></div>
      <input class="shop-search" id="shopSearch" placeholder="상품 검색">
    </div>
    <div class="product-grid" id="shopGrid"><div class="empty-products">상품을 불러오는 중입니다.</div></div>
  </div>
</main>
<footer><div class="container">제세현한의원 · 충청북도 청주시 상당구 상당로 10-1, 1층 · 043-221-1275</div></footer>
<script src="assets/config.js"></script>
<script src="/assets/cms-public-v31541.js?v=3.15.41"></script>
<script>
(function(){
 const C=window.JSH_CONFIG||{};
 const base=(C.supabaseUrl||'').replace(/\/$/,'');
 const key=C.supabaseAnonKey||'';
 let all=[],cat='all';

 const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
 const won=v=>Number(v||0)>0?Number(v).toLocaleString('ko-KR')+'원':'가격 문의';

 async function getProducts(){
   const r=await fetch(base+'/rest/v1/cms_products?select=*&is_active=eq.true&order=is_featured.desc,sort_order.asc,created_at.desc',{
     headers:{apikey:key,Authorization:'Bearer '+key}
   });
   if(!r.ok)throw new Error(await r.text());
   return r.json();
 }

 function renderCats(){
   const cats=[...new Set(all.map(x=>(x.category||'').trim()).filter(Boolean))];
   document.getElementById('shopCategories').innerHTML=
     `<button class="shop-cat ${cat==='all'?'active':''}" data-cat="all">전체</button>`+
     cats.map(c=>`<button class="shop-cat ${cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
   document.querySelectorAll('.shop-cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderCats();render();});
 }

 function render(){
   const q=document.getElementById('shopSearch').value.trim().toLowerCase();
   const rows=all.filter(p=>(cat==='all'||p.category===cat)&&(!q||((p.name||'')+' '+(p.category||'')+' '+(p.summary||'')).toLowerCase().includes(q)));
   document.getElementById('shopGrid').innerHTML=rows.length?rows.map(p=>`
     <a class="public-product-card" href="product.html?id=${encodeURIComponent(p.id)}">
       <div class="public-product-image">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}</div>
       <div class="public-product-body">
         <div class="public-product-meta">${esc(p.category||'상품')}</div>
         <h2>${esc(p.name)}</h2>
         <p>${esc(p.summary||'')}</p>
         <div class="public-price">
           <strong>${won(p.sale_price||p.regular_price)}</strong>
           ${p.sale_price&&p.regular_price&&Number(p.sale_price)<Number(p.regular_price)?`<del>${won(p.regular_price)}</del>`:''}
         </div>
         <div class="product-badges">
           ${p.is_featured?'<span class="product-badge">추천</span>':''}
           ${p.stock_status==='out_of_stock'?'<span class="product-badge sold">품절</span>':''}
         </div>
       </div>
     </a>`).join(''):'<div class="empty-products">조건에 맞는 상품이 없습니다.</div>';
 }

 JSH_PUBLIC.renderNav('shop');JSH_PUBLIC.applyBrandAssets();JSH_PUBLIC.applyDesign();
 getProducts().then(rows=>{all=rows;renderCats();render();}).catch(e=>{
   console.error(e);document.getElementById('shopGrid').innerHTML='<div class="empty-products">상품 정보를 불러오지 못했습니다.</div>';
 });
 document.getElementById('shopSearch').addEventListener('input',render);
})();
</script>
</body>
</html>
